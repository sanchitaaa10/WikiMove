<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="uc-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="15" width="940" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">WikiMove – UML Use Case Diagram</text>

  <!-- System Boundary Box -->
  <rect x="230" y="80" width="540" height="660" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">System Boundary: WikiMove Platform</text>

  <!-- Left Actors -->
  <!-- Technical Writer -->
  <g transform="translate(60, 160)">
    <circle cx="45" cy="20" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="34" x2="45" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="48" x2="70" y2="48" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="25" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="65" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="45" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Technical Writer</text>
    <text x="45" y="140" text-anchor="middle" font-size="10" fill="#64748b">(Project Lead)</text>
  </g>

  <!-- Engineering Team Member -->
  <g transform="translate(60, 360)">
    <circle cx="45" cy="20" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="34" x2="45" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="48" x2="70" y2="48" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="25" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="65" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="45" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Engineering</text>
    <text x="45" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Team Member</text>
  </g>

  <!-- Content Owner -->
  <g transform="translate(60, 560)">
    <circle cx="45" cy="20" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="34" x2="45" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="48" x2="70" y2="48" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="25" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="65" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="45" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Content Owner</text>
    <text x="45" y="140" text-anchor="middle" font-size="10" fill="#64748b">(Assigned Custodian)</text>
  </g>

  <!-- Right Actors -->
  <!-- Project Manager -->
  <g transform="translate(850, 160)">
    <circle cx="45" cy="20" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="34" x2="45" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="48" x2="70" y2="48" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="25" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="65" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="45" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Project Manager</text>
    <text x="45" y="140" text-anchor="middle" font-size="10" fill="#64748b">(Schedule / Risks)</text>
  </g>

  <!-- QA / Test Engineer -->
  <g transform="translate(850, 360)">
    <circle cx="45" cy="20" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="34" x2="45" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="48" x2="70" y2="48" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="25" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="65" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="45" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">QA / Test Engineer</text>
  </g>

  <!-- CTO / Management -->
  <g transform="translate(850, 560)">
    <circle cx="45" cy="20" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="34" x2="45" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="20" y1="48" x2="70" y2="48" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="25" y2="105" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="70" x2="65" y2="105" stroke="#0f172a" stroke-width="2"/>
    <text x="45" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">CTO / Management</text>
  </g>

  <!-- Use Case Ellipses -->
  <!-- UC-01: View Dashboard -->
  <g transform="translate(260, 120)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-01: View Dashboard</text>
  </g>

  <!-- UC-02: Review Page -->
  <g transform="translate(260, 170)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-02: Review Page</text>
  </g>

  <!-- UC-03: Classify Page -->
  <g transform="translate(260, 220)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-03: Classify Page</text>
  </g>

  <!-- Sub-usecases of Classify -->
  <g transform="translate(480, 175)">
    <ellipse cx="80" cy="16" rx="75" ry="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
    <text x="80" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">&lt;&lt;extend&gt;&gt; Keep Page</text>
  </g>
  <g transform="translate(480, 215)">
    <ellipse cx="80" cy="16" rx="75" ry="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="80" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">&lt;&lt;extend&gt;&gt; Archive Page</text>
  </g>
  <g transform="translate(480, 255)">
    <ellipse cx="80" cy="16" rx="75" ry="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
    <text x="80" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">&lt;&lt;extend&gt;&gt; Delete Page</text>
  </g>

  <!-- UC-04: Assign Owner -->
  <g transform="translate(260, 290)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-04: Assign Content Owner</text>
  </g>

  <!-- UC-05: Plan Migration -->
  <g transform="translate(260, 350)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-05: Plan Migration Batches</text>
  </g>

  <!-- UC-06: Track Migration -->
  <g transform="translate(480, 350)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-06: Track Migration Progress</text>
  </g>

  <!-- UC-07: Validate Links -->
  <g transform="translate(480, 420)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-07: Validate Links (NFR-01)</text>
  </g>

  <!-- UC-08: Validate Search -->
  <g transform="translate(480, 475)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-08: Validate Search (NFR-02)</text>
  </g>

  <!-- UC-09: Manage Risks -->
  <g transform="translate(370, 545)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">UC-09: Manage Risks (R1-R4)</text>
  </g>

  <!-- UC-10: Track Project Progress -->
  <g transform="translate(260, 615)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-10: Track Schedule &amp; Gap</text>
  </g>

  <!-- UC-11: View Reports -->
  <g transform="translate(480, 615)">
    <ellipse cx="100" cy="20" rx="90" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#uc-shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">UC-11: View Governance Reports</text>
  </g>

  <!-- Association Lines -->
  <!-- TW lines -->
  <line x1="125" y1="210" x2="260" y2="138" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="125" y1="210" x2="260" y2="188" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="125" y1="210" x2="260" y2="238" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="125" y1="210" x2="260" y2="308" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="125" y1="210" x2="260" y2="368" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Eng Team lines -->
  <line x1="125" y1="410" x2="260" y2="188" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="125" y1="410" x2="260" y2="238" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="125" y1="410" x2="260" y2="308" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Content Owner lines -->
  <line x1="125" y1="610" x2="260" y2="188" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="125" y1="610" x2="260" y2="308" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- PM lines -->
  <line x1="850" y1="210" x2="450" y2="138" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="850" y1="210" x2="570" y2="555" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="850" y1="210" x2="450" y2="625" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- QA lines -->
  <line x1="850" y1="410" x2="670" y2="435" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="850" y1="410" x2="670" y2="490" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- CTO lines -->
  <line x1="850" y1="610" x2="450" y2="138" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="850" y1="610" x2="670" y2="625" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="850" y1="610" x2="570" y2="555" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Extend arrows -->
  <line x1="450" y1="230" x2="480" y2="195" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="450" y1="238" x2="480" y2="231" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="450" y1="246" x2="480" y2="268" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Caption -->
  <text x="500" y="775" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Figure 1.2: WikiMove UML Use Case Diagram mapping 6 project actors to primary functional use cases.</text>
</svg>
