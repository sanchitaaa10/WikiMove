<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="seq-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 1, 10 5, 0 9" fill="#2563eb" />
    </marker>
    <marker id="seq-arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 1, 10 5, 0 9" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="15" width="890" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="475" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">WikiMove – UML Sequence Diagram: Page Triage &amp; Migration Lifecycle</text>

  <!-- Lifeline Headers -->
  <!-- 1. Reviewer -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#seq-shadow)"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">:Team Reviewer</text>
    <text x="60" y="38" text-anchor="middle" font-size="10" fill="#64748b">(Engineer)</text>
    <line x1="60" y1="45" x2="60" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- 2. UI -->
  <g transform="translate(230, 80)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#seq-shadow)"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">:WikiMove UI</text>
    <text x="60" y="38" text-anchor="middle" font-size="10" fill="#64748b">(Triage/Review)</text>
    <line x1="60" y1="45" x2="60" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- 3. TriageManager -->
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#seq-shadow)"/>
    <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">:TriageManager</text>
    <text x="65" y="38" text-anchor="middle" font-size="10" fill="#64748b">(Workflow Logic)</text>
    <line x1="65" y1="45" x2="65" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- 4. WikiCatalog -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#seq-shadow)"/>
    <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">:WikiCatalog</text>
    <text x="65" y="38" text-anchor="middle" font-size="10" fill="#64748b">(14k Repository)</text>
    <line x1="65" y1="45" x2="65" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- 5. TargetPlatform -->
  <g transform="translate(760, 80)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#seq-shadow)"/>
    <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">:TargetPlatform</text>
    <text x="65" y="38" text-anchor="middle" font-size="10" fill="#15803d">(New Platform)</text>
    <line x1="65" y1="45" x2="65" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- Execution Bars -->
  <rect x="115" y="145" width="10" height="400" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="285" y="150" width="10" height="390" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="460" y="180" width="10" height="330" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="640" y="200" width="10" height="230" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="820" y="370" width="10" height="110" fill="#dcfce7" stroke="#22c55e"/>

  <!-- Messages -->
  <!-- 1. Open Triage -->
  <line x1="125" y1="160" x2="285" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="205" y="154" text-anchor="middle" font-size="11" fill="#1e3a8a">1: openTriageView(teamId)</text>

  <!-- 2. Fetch Assigned -->
  <line x1="295" y1="185" x2="460" y2="185" stroke="#2563eb" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="375" y="179" text-anchor="middle" font-size="11" fill="#1e3a8a">2: getAssignedPages(teamId)</text>

  <!-- 3. Query Catalog -->
  <line x1="470" y1="205" x2="640" y2="205" stroke="#2563eb" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="555" y="199" text-anchor="middle" font-size="11" fill="#1e3a8a">3: findByTeam(teamId)</text>

  <!-- 4. Return pages -->
  <line x1="640" y1="235" x2="470" y2="235" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-ret)"/>
  <text x="555" y="229" text-anchor="middle" font-size="10" fill="#64748b">4: return pageList [quota: 40 p/d]</text>

  <!-- 5. Render list -->
  <line x1="460" y1="255" x2="295" y2="255" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-ret)"/>
  <text x="375" y="249" text-anchor="middle" font-size="10" fill="#64748b">5: renderTriageTable(pages)</text>

  <!-- 6. Review & Classify -->
  <line x1="125" y1="285" x2="285" y2="285" stroke="#2563eb" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="205" y="279" text-anchor="middle" font-size="11" fill="#1e3a8a">6: selectDecision(pageId, "KEEP", owner="EngLead")</text>

  <!-- 7. Save Decision -->
  <line x1="295" y1="310" x2="460" y2="310" stroke="#2563eb" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="375" y="304" text-anchor="middle" font-size="11" fill="#1e3a8a">7: submitDecision(decisionData)</text>

  <!-- 8. Update DB -->
  <line x1="470" y1="330" x2="640" y2="330" stroke="#2563eb" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="555" y="324" text-anchor="middle" font-size="11" fill="#1e3a8a">8: updateStatus(pageId, "KEPT", owner)</text>

  <!-- 9. Batch Migration (if KEPT) -->
  <line x1="470" y1="380" x2="820" y2="380" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="645" y="374" text-anchor="middle" font-size="11" fill="#15803d">9: migrateKeptPage(cleanContent, ownerMeta)</text>

  <!-- 10. Platform ACK -->
  <line x1="820" y1="410" x2="470" y2="410" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-ret)"/>
  <text x="645" y="404" text-anchor="middle" font-size="10" fill="#15803d">10: ackMigrationSuccess(targetUrl)</text>

  <!-- 11. Run Validation -->
  <line x1="470" y1="440" x2="820" y2="440" stroke="#2563eb" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="645" y="434" text-anchor="middle" font-size="11" fill="#1e3a8a">11: validateLinksAndSearch(targetUrl)</text>

  <!-- 12. Validation Report -->
  <line x1="820" y1="465" x2="470" y2="465" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-ret)"/>
  <text x="645" y="459" text-anchor="middle" font-size="10" fill="#64748b">12: reportValidationOk(0 broken links)</text>

  <!-- 13. Update UI -->
  <line x1="460" y1="500" x2="295" y2="500" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-ret)"/>
  <text x="375" y="494" text-anchor="middle" font-size="10" fill="#64748b">13: notifySuccess("Page migrated &amp; owner bound")</text>

  <!-- 14. UI display -->
  <line x1="285" y1="525" x2="125" y2="525" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-ret)"/>
  <text x="205" y="519" text-anchor="middle" font-size="10" fill="#64748b">14: refreshDashboardKPIs()</text>

  <!-- Caption -->
  <text x="475" y="695" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Figure 1.4: WikiMove UML Sequence Diagram illustrating end-to-end execution of a triage review and verified migration flow.</text>
</svg>
