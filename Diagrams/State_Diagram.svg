<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="st-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 1, 10 5, 0 9" fill="#334155" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="15" width="940" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">WikiMove – UML State Machine Diagram: Wiki Page Lifecycle</text>

  <!-- Initial State -->
  <circle cx="70" cy="180" r="14" fill="#0f172a"/>
  <line x1="84" y1="180" x2="130" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="107" y="170" text-anchor="middle" font-size="10" fill="#64748b">import</text>

  <!-- State 1: Discovered -->
  <g transform="translate(130, 155)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Discovered</text>
    <text x="65" y="42" text-anchor="middle" font-size="10" fill="#64748b">(In Legacy 14k)</text>
  </g>

  <!-- Transition to Assigned -->
  <line x1="260" y1="180" x2="310" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="285" y="172" text-anchor="middle" font-size="10" fill="#475569">assignTeam</text>

  <!-- State 2: UnderReview -->
  <g transform="translate(310, 155)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">UnderReview</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#64748b">(Triage: 40 p/d)</text>
  </g>

  <!-- Fork Branches from UnderReview -->
  <!-- Branch 1: DELETE -->
  <path d="M 380 155 L 380 90 L 490 90" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="430" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#ef4444">action == DELETE</text>

  <g transform="translate(490, 65)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Deleted</text>
    <text x="65" y="42" text-anchor="middle" font-size="10" fill="#7f1d1d">(Purged / Redirect)</text>
  </g>

  <!-- Branch 2: ARCHIVE -->
  <line x1="450" y1="180" x2="520" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="485" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#f59e0b">ARCHIVE</text>

  <g transform="translate(520, 155)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Archived</text>
    <text x="65" y="42" text-anchor="middle" font-size="10" fill="#78350f">(Cold Storage)</text>
  </g>

  <!-- Branch 3: KEEP -->
  <path d="M 380 205 L 380 280 L 480 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="420" y="270" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">KEEP (50%)</text>

  <!-- State 3: KeptPendingOwner -->
  <g transform="translate(480, 255)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="80" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">KeptPendingOwner</text>
    <text x="80" y="42" text-anchor="middle" font-size="10" fill="#166534">(Enforces R4 guard)</text>
  </g>

  <!-- Transition: Assign Owner -->
  <line x1="640" y1="280" x2="710" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="675" y="272" text-anchor="middle" font-size="10" fill="#475569">assignOwner</text>

  <!-- State 4: OwnerAssigned -->
  <g transform="translate(710, 255)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="150" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">OwnerAssigned</text>
    <text x="75" y="42" text-anchor="middle" font-size="10" fill="#166534">(Named Custodian)</text>
  </g>

  <!-- Transition: Batch into Migration -->
  <path d="M 785 305 L 785 380 L 710 380" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="750" y="370" text-anchor="middle" font-size="10" fill="#475569">batchQueue(25 p/d)</text>

  <!-- State 5: QueuedForMigration -->
  <g transform="translate(530, 355)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">QueuedForMigration</text>
    <text x="90" y="42" text-anchor="middle" font-size="10" fill="#64748b">(Total 7,000 pages)</text>
  </g>

  <!-- Transition: Execute migration -->
  <line x1="530" y1="380" x2="450" y2="380" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="490" y="372" text-anchor="middle" font-size="10" fill="#475569">migrate()</text>

  <!-- State 6: Migrated -->
  <g transform="translate(290, 355)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Migrated</text>
    <text x="80" y="42" text-anchor="middle" font-size="10" fill="#64748b">(Target Platform)</text>
  </g>

  <!-- Transition: Validate -->
  <line x1="290" y1="380" x2="210" y2="380" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="250" y="372" text-anchor="middle" font-size="10" fill="#475569">validateQA()</text>

  <!-- State 7: Validated -->
  <g transform="translate(70, 355)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Validated</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#64748b">(Links 100%, Search)</text>
  </g>

  <!-- Transition: Release to Governance -->
  <path d="M 140 405 L 140 490 L 320 490" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="220" y="480" text-anchor="middle" font-size="10" fill="#475569">handoverToGovernance</text>

  <!-- State 8: ActiveGoverned -->
  <g transform="translate(320, 465)" filter="url(#st-shadow)">
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">ActiveGoverned</text>
    <text x="110" y="46" text-anchor="middle" font-size="10" fill="#166534">90-Day Periodic Owner Revalidation</text>
  </g>

  <!-- Self-loop on ActiveGoverned: Revalidation -->
  <path d="M 430 520 C 430 570, 480 570, 480 520" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#st-arrow)"/>
  <text x="455" y="580" text-anchor="middle" font-size="10" fill="#166534">periodicReview[90-days]</text>

  <!-- Final End States -->
  <!-- End state from Deleted -->
  <line x1="620" y1="90" x2="680" y2="90" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <circle cx="695" cy="90" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="695" cy="90" r="8" fill="#0f172a"/>

  <!-- End state from Archived -->
  <line x1="650" y1="180" x2="710" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <circle cx="725" cy="180" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="725" cy="180" r="8" fill="#0f172a"/>

  <!-- End state from ActiveGoverned -->
  <line x1="540" y1="490" x2="630" y2="490" stroke="#334155" stroke-width="1.8" marker-end="url(#st-arrow)"/>
  <text x="585" y="482" text-anchor="middle" font-size="10" fill="#475569">decommission</text>
  <circle cx="645" cy="490" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="645" cy="490" r="8" fill="#0f172a"/>

  <!-- Caption -->
  <text x="500" y="650" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Figure 1.6: WikiMove UML State Machine Diagram showing transitions from discovery, triage, migration, to long-term governed custody.</text>
</svg>
