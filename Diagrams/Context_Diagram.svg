<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="475" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">WikiMove – System Context Diagram (Level 0)</text>

  <!-- Central Proposed System Boundary -->
  <rect x="325" y="140" width="300" height="340" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="345" y="160" width="260" height="40" rx="6" fill="#2563eb"/>
  <text x="475" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">WikiMove Management System</text>
  <text x="475" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">(Proposed System Boundary)</text>

  <rect x="345" y="245" width="260" height="210" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="360" y="275" font-size="12" font-weight="600" fill="#334155">• Inventory &amp; Catalog Management (14,000 Pages)</text>
  <text x="360" y="305" font-size="12" font-weight="600" fill="#334155">• Content Triage (Keep / Archive / Delete)</text>
  <text x="360" y="335" font-size="12" font-weight="600" fill="#334155">• Owner Assignment &amp; Accountability</text>
  <text x="360" y="365" font-size="12" font-weight="600" fill="#334155">• Migration Tracking (7,000 Kept Pages)</text>
  <text x="360" y="395" font-size="12" font-weight="600" fill="#334155">• Link Integrity &amp; Search Validation</text>
  <text x="360" y="425" font-size="12" font-weight="600" fill="#334155">• Risk Tracking &amp; Licence Expiry Guard</text>

  <!-- External Entities -->

  <!-- 1. Technical Writer -->
  <rect x="40" y="130" width="210" height="85" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="130" width="210" height="28" rx="10" fill="#e2e8f0"/>
  <text x="145" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Technical Writer (Lead)</text>
  <text x="145" y="180" text-anchor="middle" font-size="11" fill="#475569">Capacity: 3 person-days/wk</text>
  <text x="145" y="198" text-anchor="middle" font-size="11" fill="#64748b">Triage coordination &amp; audit</text>

  <!-- 2. Engineering Teams -->
  <rect x="40" y="270" width="210" height="95" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="270" width="210" height="28" rx="10" fill="#e2e8f0"/>
  <text x="145" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">12 Engineering Teams</text>
  <text x="145" y="320" text-anchor="middle" font-size="11" fill="#475569">Capacity: 12 person-days/wk</text>
  <text x="145" y="338" text-anchor="middle" font-size="11" fill="#475569">(1 person-day/wk each)</text>
  <text x="145" y="355" text-anchor="middle" font-size="11" fill="#64748b">Domain page review &amp; triage</text>

  <!-- 3. Legacy Wiki Platform -->
  <rect x="40" y="420" width="210" height="90" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="420" width="210" height="28" rx="10" fill="#fee2e2"/>
  <text x="145" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Legacy Wiki Platform</text>
  <text x="145" y="470" text-anchor="middle" font-size="11" fill="#b91c1c">Licence expires in 9 mos (~39 wks)</text>
  <text x="145" y="490" text-anchor="middle" font-size="11" fill="#7f1d1d">Source of 14,000 pages</text>

  <!-- 4. CTO & Management -->
  <rect x="700" y="130" width="210" height="85" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="130" width="210" height="28" rx="10" fill="#e2e8f0"/>
  <text x="805" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">CTO / Executive Sponsor</text>
  <text x="805" y="180" text-anchor="middle" font-size="11" fill="#475569">Governance oversight</text>
  <text x="805" y="198" text-anchor="middle" font-size="11" fill="#64748b">Progress &amp; risk dashboard</text>

  <!-- 5. New Target Platform -->
  <rect x="700" y="270" width="210" height="95" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="270" width="210" height="28" rx="10" fill="#dcfce7"/>
  <text x="805" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">New Knowledge Platform</text>
  <text x="805" y="320" text-anchor="middle" font-size="11" fill="#15803d">Destination for 7,000 kept pages</text>
  <text x="805" y="338" text-anchor="middle" font-size="11" fill="#166534">Enforces owner metadata</text>
  <text x="805" y="355" text-anchor="middle" font-size="11" fill="#64748b">Modern search &amp; permissions</text>

  <!-- 6. QA & Test Engineer -->
  <rect x="700" y="420" width="210" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="420" width="210" height="28" rx="10" fill="#e2e8f0"/>
  <text x="805" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">QA / Test Engineer</text>
  <text x="805" y="470" text-anchor="middle" font-size="11" fill="#475569">Link integrity validation</text>
  <text x="805" y="490" text-anchor="middle" font-size="11" fill="#64748b">Search indexing verification</text>

  <!-- Connectors -->
  <!-- TW to System -->
  <line x1="250" y1="172" x2="325" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="287" y="165" text-anchor="middle" font-size="10" fill="#475569">Triage plan</text>

  <!-- Teams to System -->
  <line x1="250" y1="315" x2="325" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="287" y="308" text-anchor="middle" font-size="10" fill="#475569">Decisions</text>

  <!-- Legacy Wiki to System -->
  <line x1="250" y1="465" x2="325" y2="440" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="287" y="445" text-anchor="middle" font-size="10" fill="#b91c1c">Page dumps</text>

  <!-- System to CTO -->
  <line x1="625" y1="172" x2="700" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="165" text-anchor="middle" font-size="10" fill="#475569">KPI Reports</text>

  <!-- System to Target Platform -->
  <line x1="625" y1="315" x2="700" y2="315" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="308" text-anchor="middle" font-size="10" fill="#15803d">Clean pages</text>

  <!-- QA to System -->
  <line x1="700" y1="465" x2="625" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="445" text-anchor="middle" font-size="10" fill="#475569">Test results</text>

  <!-- Footer note -->
  <text x="475" y="585" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Figure 1.1: WikiMove System Context Diagram showing internal/external actor interactions and critical platform constraints.</text>
</svg>
